<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sextilhas geradas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Courier+Prime&family=Special+Elite&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/folheto.css?v=2">
<style>
  :root {
    --papel: #efe4cc; --folha: #f4efe3; --tinta: #151210; --tinta-2: #4a3f35; --tinta-3: #7a6d5f;
    --vermelho: #a3301f; --verde: #2f5d3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--papel); color: var(--tinta);
    font-family: "Libre Baskerville", Georgia, serif; font-size: 15px; line-height: 1.5;
    background-image: radial-gradient(#1b161210 1px, transparent 1px); background-size: 4px 4px;
  }
  header { border-bottom: 3px double var(--tinta); padding: 18px 16px 12px; text-align: center; }
  header h1 { font: 700 clamp(26px, 5vw, 40px)/1.1 "Oswald", sans-serif; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
  header p { margin: 4px 0 0; font-style: italic; color: var(--tinta-2); font-size: 14px; }
  nav { margin-top: 8px; font: 700 13px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: 1px; }
  nav a { color: var(--tinta); margin: 0 8px; }
  nav a[aria-current] { color: var(--vermelho); text-decoration: none; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }

  .filtros { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; margin-bottom: 18px; }
  .filtros label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--tinta-2); }
  .filtros input, .filtros select { font: 14px "Libre Baskerville", serif; color: var(--tinta); background: #fbf6ea; border: 1.5px solid var(--tinta); padding: 5px 6px; }
  .contagem { font: 13px "Courier Prime", monospace; color: var(--tinta-2); margin-left: auto; }

  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px; align-items: start; }
  .mini { background: var(--folha); border: 3px solid var(--tinta); padding: 5px; box-shadow: 5px 5px 0 #15121055; min-width: 0;
          transition: transform .18s, box-shadow .18s; }
  .mini:hover { transform: translate(-3px, -3px) rotate(-.4deg); box-shadow: 9px 9px 0 #15121066; }
  @media (prefers-reduced-motion: reduce) { .mini { transition: none; } .mini:hover { transform: none; } }
  .mini .moldura { border: 1.5px solid var(--tinta); padding: 12px 14px 10px; }
  .mini .quem { font: 700 19px/1.15 "Oswald", sans-serif; text-align: center; overflow-wrap: anywhere; }
  .mini .quem small { display: block; font: 12px "Courier Prime", monospace; color: var(--tinta-2); margin-top: 3px; }
  .mini .div { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .mini .div::before, .mini .div::after { content: ""; flex: 1; border-top: 1.5px solid var(--tinta); }
  .mini .manchete { font: 700 16px/1.15 "Oswald", sans-serif; text-transform: uppercase; text-align: center; }
  .mini .xilo { aspect-ratio: 3 / 2; border: 1.5px solid var(--tinta); background: #ddd5c3; overflow: hidden; margin-top: 6px; }
  .mini .xilo img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.15); }
  .mini .versos { font: 13px/1.5 "Courier Prime", monospace; margin: 10px 2px 8px; }
  .mini .estrofe + .estrofe { margin-top: .8em; }
  .selo { display: inline-block; font: 700 12px "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .6px; padding: 1px 8px; border: 2px solid currentColor; }
  .selo.entra { color: var(--verde); } .selo.descarte { color: var(--vermelho); }
  .motivo { font-size: 12.5px; color: var(--vermelho); margin-top: 4px; overflow-wrap: anywhere; }
  .vazio { text-align: center; color: var(--tinta-2); padding: 40px 0; grid-column: 1 / -1; }
  .vazio a { color: var(--tinta); }
</style>
</head>
<body>
<header>
  <h1>Sextilhas</h1>
  <p>Tudo o que já foi gerado aqui, com o nome de quem gerou. Passe o mouse nas palavras sublinhadas para ver o significado.</p>
  <nav><a href="/">Início</a> · <a href="/gerador">Gerador</a> · <a href="/sextilhas" aria-current="page">Sextilhas</a> · <a href="/historico">Histórico</a> · <a href="/logs">Logs</a></nav>
</header>

<main>
  <div class="filtros">
    <label>Procurar por nome <input type="search" id="f-nome" placeholder="Nome de quem gerou"></label>
    <label>Resultado
      <select id="f-resultado"><option value="">todas</option><option value="entra">passaram no verificador</option><option value="descarte">descarte</option></select>
    </label>
    <span class="contagem" id="contagem"></span>
  </div>
  <section class="grade" id="grade"><div class="vazio">Carregando…</div></section>
</main>

<script src="/static/folheto.js?v=2"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const quando = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const sem = (s) => s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
// as gerações de antes do campo de nome foram todas do grupo
const autor = (i) => i.autor ?? "Grupo 6";
let ITENS = [];

const cartao = (i) => `<article class="mini"><div class="moldura">
    <div class="quem">${esc(autor(i))}<small>${esc(quando(i.inicio))}</small></div>
    <div class="div">✸</div>
    <div class="manchete">${esc(i.manchete)}</div>
    ${i.arquivos.imagem ? `<div class="xilo"><img loading="lazy" alt="xilogravura: ${esc(i.manchete)}" src="/${esc(i.arquivos.imagem)}"></div>` : ""}
    <div class="versos">${i.estrofes.map((vs) => `<div class="estrofe">${vs.map((v) => `<div>${esc(v)}</div>`).join("")}</div>`).join("")}</div>
    <span class="selo ${i.entra ? "entra" : "descarte"}">${i.entra ? "Passou" : "Descarte"}</span>
    ${i.motivo ? `<div class="motivo">${esc(i.motivo)}</div>` : ""}
  </div></article>`;

function render() {
  const nome = sem($("f-nome").value.trim()), r = $("f-resultado").value;
  const vis = ITENS.filter((i) => sem(autor(i)).includes(nome) && (!r || (r === "entra") === !!i.entra));
  $("contagem").textContent = `${vis.length} de ${ITENS.length} ${ITENS.length === 1 ? "geração" : "gerações"}`;
  $("grade").innerHTML = vis.length ? vis.map(cartao).join("")
    : ITENS.length ? '<div class="vazio">Nenhuma geração com esses filtros.</div>'
    : '<div class="vazio">Ainda não há nada aqui. <a href="/gerador">Gere a primeira sextilha</a>.</div>';
  marcarTermos($("grade"));
}

fetch("/api/historico").then((r) => r.json())
  .then(({ itens }) => {
    ITENS = itens.filter((i) => i.estrofes.length);
    $("f-nome").oninput = render; $("f-resultado").onchange = render;
    render();
  })
  .catch((e) => $("grade").innerHTML = `<div class="vazio">Não consegui carregar as sextilhas: ${esc(e)}</div>`);
</script>
</body>
</html>
